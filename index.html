<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Задачник-блокнот</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9e7e1;--bar:#fff;--tx:#222;--ln:#8a877c;--bd:#cfcbc0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1e1c;--bar:#2a2b28;--tx:#eee;--bd:#444}}
:root[data-theme="dark"]{--bg:#1d1e1c;--bar:#2a2b28;--tx:#eee;--bd:#444}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#top{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--bd)}
#tabs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto}
.tab{min-height:40px;padding:0 14px;border:1px solid var(--bd);border-bottom:0;border-radius:10px 10px 0 0;background:var(--bg);color:var(--tx);font:inherit;white-space:nowrap}
.tab.on{background:#fffefb;color:#222;font-weight:700}
#tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:var(--bar)}
#tb button{min-width:44px;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bar);color:var(--tx);font-size:18px;padding:0 8px}
#tb button.on{outline:3px solid #3b82f6}
#tb .sw{width:34px;min-width:34px;min-height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #888}
#tb .f{width:34px;min-width:34px;min-height:34px;border-radius:6px;font-size:14px}
.sp{width:1px;height:30px;background:var(--bd);margin:0 4px}
.sheet{max-width:1100px;margin:12px auto;background:#fffefb;color:#222;border:2px solid #222;container-type:inline-size}
.lbl{font-size:11px;color:#888;padding:4px 8px 0}
#ttl{height:64px;position:relative;border-bottom:1px dotted var(--ln)}
.row{display:grid;grid-template-columns:minmax(48px,6.2%) minmax(48px,6.2%) minmax(46px,6%) minmax(38px,4.6%) 1fr minmax(70px,8%);height:56px;border-bottom:1px dotted var(--ln)}
.row.hd{height:46px;border-bottom:2px solid #222;font-weight:700;text-decoration:underline;position:sticky;top:var(--th,110px);background:#fffefb;z-index:2}
.c{position:relative;border-right:1px dotted var(--ln);overflow:hidden;display:flex;align-items:center;padding:0 3px;font-size:clamp(12px,1.4cqw,16px);line-height:1.1;overflow-wrap:anywhere}
.c:last-child{border-right:0}
.hd .c{font-size:clamp(13px,1.7cqw,19px);line-height:1.1;text-align:center;padding:0 1px;justify-content:center;cursor:pointer;touch-action:auto}.hd .c.flt{background:#cfe3ff}
.ink{padding:0}.ink canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ink span{position:relative;padding:0 6px;pointer-events:none;font-size:clamp(16px,1.9cqw,22px)}
.ink input{position:absolute;inset:0;width:100%;z-index:3;font-size:18px;border:2px solid #3b82f6}
.pop{position:fixed;z-index:20;background:var(--bar);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:0 6px 24px #0004;padding:6px;max-height:60vh;overflow:auto;min-width:170px}
.pop button{display:block;width:100%;text-align:left;min-height:44px;border:0;background:none;color:var(--tx);font:inherit;padding:0 10px;border-radius:8px}
.pop button:hover,.pop button.on{background:#3b82f633}
.pop input{width:100%;min-height:44px;margin-bottom:6px;font:inherit;padding:0 8px}
dialog{border:1px solid var(--bd);border-radius:14px;padding:12px;width:min(900px,95vw);background:var(--bar);color:var(--tx)}
#mcv{display:block;width:100%;height:50vh;border:1px solid var(--ln);background:repeating-linear-gradient(#fffefb 0 39px,#ddd 39px 40px);touch-action:none}
dialog textarea{width:100%;height:200px;font:inherit}
.dbtn{min-height:44px;padding:0 16px;margin:8px 6px 0 0;border-radius:10px;border:1px solid var(--bd);background:var(--bar);color:var(--tx);font:inherit}
</style></head>
<body>
<div id="top"><div id="tabs"></div><div id="tb"></div></div>
<div class="sheet"><div class="lbl">Наименование направления</div><div id="ttl"></div><div id="grid"></div></div>
<dialog id="dlg"><b>Дополнительная информация</b> <small>(пишите стилусом, инструменты — на панели сверху)</small>
<canvas id="mcv"></canvas><button class="dbtn" id="mclr">Очистить</button><button class="dbtn" id="mok">Готово</button></dialog>
<dialog id="ref"><b>Шаблоны (по одному значению в строке)</b><p>Исполнители</p><textarea id="lex"></textarea><p>Изделия / направления</p><textarea id="lpr"></textarea>
<button class="dbtn" id="rok">Сохранить</button></dialog>
<script>
const $=s=>document.querySelector(s),COLS=['ex','pr','inf','no','task','due'],HD=['Исп.','Изд.','Для инф.','№','Задача','Срок'];
const PEN=['#222222','#e5192b','#f2d600','#5fd13f','#00e5d4','#a96ae0'],BG={y:'#fff176',r:'#ef9a9a',g:'#a5d6a7'};
let S={ex:[],pr:[],sheets:[],cur:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('zad1')||'{}'))}catch(e){}
const mk=()=>({ex:'',pr:'',inf:{s:[]},no:{s:[],t:''},task:{s:[],t:''},due:'',fill:{}});
if(!S.sheets.length)S.sheets=[{name:'Лист 1',title:S.title||{s:[],t:''},rows:S.rows||[]}];
delete S.title;delete S.rows;
const mkSheet=n=>({name:n,title:{s:[],t:''},rows:Array.from({length:20},mk)});
S.sheets.forEach(x=>{while(x.rows.length<20)x.rows.push(mk())});
if(S.cur>=S.sheets.length)S.cur=0;
const sh=()=>S.sheets[S.cur];
const ymd=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const save=()=>{try{localStorage.setItem('zad1',JSON.stringify(S))}catch(e){}};
let T={tool:'pen',color:PEN[0],w:3,fill:'y'},F={},hist=[],Q=[],M=null,P=null;

/* ---------- рукописный движок ---------- */
function paint(cv,sc){
 const r=cv.getBoundingClientRect(),d=devicePixelRatio||1,W=Math.round(r.width*d),H=Math.round(r.height*d);
 if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
 const x=cv.getContext('2d'),u=H;x.clearRect(0,0,W,H);x.lineCap=x.lineJoin='round';
 for(const s of sc){
  x.strokeStyle=s.c;x.globalAlpha=s.h?.35:1;
  if(s.h){x.lineWidth=s.w*u;x.beginPath();s.p.forEach((p,i)=>i?x.lineTo(p[0]*u,p[1]*u):x.moveTo(p[0]*u,p[1]*u));x.stroke()}
  else for(let i=1;i<s.p.length;i++){const a=s.p[i-1],b=s.p[i];x.lineWidth=s.w*u*(.5+b[2]);x.beginPath();x.moveTo(a[0]*u,a[1]*u);x.lineTo(b[0]*u,b[1]*u);x.stroke()}
 }
 x.globalAlpha=1;
}
function attach(cv,get,done){
 let cur=null,tp=null;
 const H=()=>cv.getBoundingClientRect().height;
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.height,(e.clientY-r.top)/r.height,e.pressure||.5]};
 const er=p=>{const o=get(),rad=T.w*4/H(),n=o.s.length;o.s=o.s.filter(s=>!s.p.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<rad));if(o.s.length!==n)paint(cv,o.s)};
 cv.onpointerdown=e=>{
  cv.setPointerCapture(e.pointerId);
  const t=e.pointerType==='touch';
  if(t||!['pen','hl','er'].includes(T.tool)){tp={x:e.clientX,y:e.clientY,m:0,t};return}
  cur={c:T.color,h:T.tool==='hl'?1:0,w:(T.tool==='hl'?T.w*5:T.w)/H(),p:[pt(e)],er:T.tool==='er'};
  if(cur.er)er(cur.p[0]);
 };
 cv.onpointermove=e=>{
  if(tp){tp.m+=Math.abs(e.clientX-tp.x)+Math.abs(e.clientY-tp.y);if(tp.t)scrollBy(0,tp.y-e.clientY);tp.x=e.clientX;tp.y=e.clientY;return}
  if(!cur)return;
  for(const v of(e.getCoalescedEvents?e.getCoalescedEvents():[e])){const p=pt(v);cur.er?er(p):cur.p.push(p)}
  if(!cur.er)paint(cv,get().s.concat(cur));
 };
 const up=()=>{
  if(tp){const m=tp.m;tp=null;if(m<10)done&&done('tap');return}
  if(!cur)return;
  if(!cur.er){if(cur.p.length<2)cur.p.push(cur.p[0].slice());get().s.push(cur);hist.push({o:get(),s:cur})}
  cur=null;paint(cv,get().s);save();done&&done('ink');
 };
 cv.onpointerup=up;cv.onpointercancel=()=>{cur=tp=null;paint(cv,get().s)};
}
function edit(d,o,sp){
 const i=document.createElement('input');i.value=o.t||'';d.append(i);i.focus();let dn=0;
 i.onblur=()=>{if(dn)return;dn=1;o.t=i.value;sp.textContent=o.t;i.remove();save()};
 i.onkeydown=e=>{if(e.key==='Enter')i.blur()};
}
function inkCell(o){
 const d=document.createElement('div');d.className='c ink';d.innerHTML='<canvas></canvas><span></span>';
 const cv=d.firstChild,sp=d.lastChild;sp.textContent=o.t||'';
 attach(cv,()=>o,k=>{if(k!=='tap')return;if(T.tool==='kbd')edit(d,o,sp);else if(T.tool==='fill')fillAt(d)});
 Q.push(()=>paint(cv,o.s));return d;
}

/* ---------- цвета, фильтры ---------- */
const fmt=s=>{const[a,b,c]=s.split('-');return c+'.'+b+'.'+a.slice(2)};
function col(r,k){
 if(r.fill[k])return r.fill[k];
 if(k==='inf'&&r.inf.s.length)return'y';
 if(k==='due'&&r.due){const d=Math.round((new Date(r.due+'T00:00')-new Date(new Date().toDateString()))/864e5);if(d<=0)return'r';if(d<=3)return'y'}
 return'';
}
function fillAt(el){
 const r=sh().rows[el.dataset.r];if(!r)return;const k=el.dataset.c;
 if(T.fill==='x'||r.fill[k]===T.fill)delete r.fill[k];else r.fill[k]=T.fill;
 save();render();
}
function txt(r,k){return k==='due'?(r.due?fmt(r.due):''):(k==='no'||k==='task')?(r[k].t||''):(k==='ex'||k==='pr')?r[k]:''}
function vis(r){
 return COLS.every(k=>{const f=F[k];if(!f)return true;
  if(f.q&&!txt(r,k).toLowerCase().includes(f.q.toLowerCase()))return false;
  if(f.c&&(f.c==='w'?col(r,k)!=='':col(r,k)!==f.c))return false;return true});
}

/* ---------- всплывающие окна ---------- */
function closePop(){P&&P.remove();P=null}
function pop(a,n){
 closePop();P=document.createElement('div');P.className='pop';P.append(n);document.body.append(P);
 const r=a.getBoundingClientRect();P.style.left=Math.max(4,Math.min(r.left,innerWidth-P.offsetWidth-8))+'px';P.style.top=Math.max(4,Math.min(r.bottom,innerHeight-P.offsetHeight-8))+'px';
}
document.addEventListener('pointerdown',e=>{if(P&&!P.contains(e.target))closePop()},true);
const btn=(t,f,on)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;if(on)b.className='on';return b};
function filterPop(c,k){
 const w=document.createElement('div'),f=F[k]=F[k]||{q:'',c:''};
 const i=document.createElement('input');i.placeholder='Название…';i.value=f.q;i.oninput=()=>{f.q=i.value;render()};w.append(i);
 [['','Любой цвет'],['w','Белый'],['y','Жёлтый'],['r','Красный'],['g','Зелёный']].forEach(([v,l])=>w.append(btn(l,()=>{f.c=v;closePop();render()},f.c===v)));
 w.append(btn('Сбросить фильтр',()=>{delete F[k];closePop();render()}));pop(c,w);
}
function menuPop(c,r,k){
 const w=document.createElement('div'),L=S[k];
 w.append(btn('— пусто —',()=>{r[k]='';save();closePop();render()}));
 if(!L.length)w.append(Object.assign(document.createElement('p'),{textContent:'Список пуст: добавьте значения в «Шаблонах» (☰)'}));
 L.forEach(v=>w.append(btn(v,()=>{r[k]=v;save();closePop();render()},r[k]===v)));pop(c,w);
}
$('#grid').onclick=e=>{
 const c=e.target.closest('.c');if(!c||c.classList.contains('ink'))return;
 if(c.dataset.h)return filterPop(c,c.dataset.h);
 if(T.tool==='fill')return fillAt(c);
 const r=sh().rows[c.dataset.r],k=c.dataset.c;
 if(k==='ex'||k==='pr')menuPop(c,r,k);
 else if(k==='inf'){M=r.inf;$('#dlg').showModal();paint($('#mcv'),M.s)}
 else if(k==='due')calPop(c,r);
};
attach($('#mcv'),()=>M);
$('#mclr').onclick=()=>{M.s=[];paint($('#mcv'),M.s);save()};
$('#mok').onclick=()=>$('#dlg').close();
$('#dlg').onclose=()=>{save();render()};
$('#rok').onclick=()=>{const L=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);S.ex=L('#lex');S.pr=L('#lpr');save();$('#ref').close()};

function ask(a,q,f){const w=document.createElement('div');w.append(Object.assign(document.createElement('p'),{textContent:q}),btn('Да, удалить',()=>{closePop();f()}),btn('Отмена',closePop));pop(a,w)}
function calPop(a,r){
 const d=r.due?new Date(r.due+'T12:00'):new Date();let y=d.getFullYear(),m=d.getMonth();
 const w=document.createElement('div');w.style.width='290px';
 const set=v=>{r.due=v;save();closePop();render()};
 const draw=()=>{
  w.innerHTML='';const hd=document.createElement('div');hd.style.cssText='display:flex;align-items:center;justify-content:space-between';
  const p=btn('‹',()=>{m--;if(m<0){m=11;y--}draw()}),n=btn('›',()=>{m++;if(m>11){m=0;y++}draw()});p.style.width=n.style.width='48px';p.style.textAlign=n.style.textAlign='center';
  hd.append(p,Object.assign(document.createElement('b'),{textContent:new Date(y,m,1).toLocaleString('ru',{month:'long',year:'numeric'})}),n);w.append(hd);
  const g=document.createElement('div');g.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center';
  'ПнВтСрЧтПтСбВс'.match(/../g).forEach(x=>g.append(Object.assign(document.createElement('small'),{textContent:x})));
  const off=(new Date(y,m,1).getDay()+6)%7,cnt=new Date(y,m+1,0).getDate();
  for(let i=0;i<off;i++)g.append(document.createElement('i'));
  for(let i=1;i<=cnt;i++){const v=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
   const b=btn(i,()=>set(v),v===r.due);b.style.cssText='text-align:center;padding:0;min-width:0';if(v===ymd())b.style.fontWeight='700';g.append(b)}
  w.append(g,btn('Сегодня',()=>set(ymd())),btn('Очистить дату',()=>set('')));
 };
 draw();pop(a,w);
}
function tabMenu(a,i){
 const w=document.createElement('div'),s=S.sheets[i];
 const inp=Object.assign(document.createElement('input'),{value:s.name,placeholder:'Название вкладки'});
 inp.oninput=()=>{s.name=inp.value||' ';a.textContent=s.name;save()};
 w.append(inp,btn('Удалить лист',()=>ask(a,'Удалить лист «'+s.name+'» со всеми записями?',()=>{if(S.sheets.length<2)return;S.sheets.splice(i,1);S.cur=Math.max(0,S.cur-(i<=S.cur?1:0));save();render()})));
 pop(a,w);
}
function tabs(){
 const t=$('#tabs');t.innerHTML='';
 S.sheets.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===S.cur?' on':'');b.textContent=s.name;
  b.onclick=()=>{if(S.cur===i)tabMenu(b,i);else{S.cur=i;save();render()}};t.append(b)});
 const a=document.createElement('button');a.className='tab';a.textContent='+';a.title='Новый лист';
 a.onclick=()=>{S.sheets.push(mkSheet('Лист '+(S.sheets.length+1)));S.cur=S.sheets.length-1;save();render()};t.append(a);
}
/* ---------- панель инструментов ---------- */
function ui(){
 document.querySelectorAll('#tb [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===T.tool));
 document.querySelectorAll('#tb [data-f]').forEach(b=>b.classList.toggle('on',T.tool==='fill'&&b.dataset.f===T.fill));
 document.querySelectorAll('#tb .sw').forEach(b=>b.classList.toggle('on',b.dataset.c===T.color&&['pen','hl'].includes(T.tool)));
}
(function(){
 const tb=$('#tb'),add=(t,f,x={})=>{const b=document.createElement('button');b.innerHTML=t;b.onclick=f;Object.assign(b,x);tb.append(b);return b};
 const sp=()=>tb.append(Object.assign(document.createElement('i'),{className:'sp'}));
 [['kbd','⌨','Клавиатура'],['pen','✒️','Ручка'],['hl','🖍','Маркер-выделитель'],['er','🧽','Ластик (ручка и выделение)']].forEach(([t,i,ti])=>{add(i,()=>{T.tool=t;ui()},{title:ti}).dataset.t=t});
 sp();
 PEN.forEach(c=>{const b=add('',()=>{T.color=c;if(!['pen','hl'].includes(T.tool))T.tool='pen';ui()},{className:'sw',title:'Цвет'});b.dataset.c=c;b.style.background=c});
 const r=Object.assign(document.createElement('input'),{type:'range',min:1,max:12,value:T.w,title:'Толщина линии'});r.oninput=()=>T.w=+r.value;tb.append(r);
 sp();
 [['y','#fff176'],['r','#ef9a9a'],['g','#a5d6a7'],['x','#fff']].forEach(([f,c])=>{const b=add(f==='x'?'⊘':'',()=>{T.tool='fill';T.fill=f;ui()},{className:'f',title:f==='x'?'Снять заливку':'Залить ячейку'});b.dataset.f=f;b.style.background=c});
 sp();
 add('↶',()=>{while(hist.length){const h=hist.pop(),i=h.o.s.indexOf(h.s);if(i>=0){h.o.s.splice(i,1);save();render();if($('#dlg').open)paint($('#mcv'),M.s);break}}},{title:'Отменить'});
 add('+ строка',()=>{sh().rows.push(mk());save();render()});
 const mb=add('− строка',()=>ask(mb,'Удалить последнюю строку?',()=>{if(sh().rows.length>1){sh().rows.pop();save();render()}}));
 add('☰',()=>{$('#lex').value=S.ex.join('\n');$('#lpr').value=S.pr.join('\n');$('#ref').showModal()},{title:'Шаблоны: исполнители и изделия'});
 ui();
})();

/* ---------- отрисовка таблицы ---------- */
function render(){
 closePop();Q=[];const g=$('#grid');g.innerHTML='';
 const h=document.createElement('div');h.className='row hd';
 HD.forEach((t,i)=>{const c=document.createElement('div'),k=COLS[i];c.className='c'+(F[k]&&(F[k].q||F[k].c)?' flt':'');c.textContent=t;c.dataset.h=k;h.append(c)});
 g.append(h);
 sh().rows.forEach((r,i)=>{
  if(!vis(r))return;const row=document.createElement('div');row.className='row';
  COLS.forEach(k=>{
   let c;
   if(k==='no'||k==='task')c=inkCell(r[k]);
   else{c=document.createElement('div');c.className='c';c.textContent=k==='inf'?(r.inf.s.length?'✎':''):k==='due'?(r.due?fmt(r.due):''):r[k]}
   c.dataset.r=i;c.dataset.c=k;c.style.background=BG[col(r,k)]||'';row.append(c);
  });
  g.append(row);
 });
 const t=inkCell(sh().title);t.style.cssText='position:absolute;inset:0';$('#ttl').replaceChildren(t);
 Q.forEach(f=>f());tabs();document.documentElement.style.setProperty('--th',$('#top').offsetHeight+'px');
}
addEventListener('resize',render);render();
</script></body></html>
