{"name": "Build APK", "on": ["push", "workflow_dispatch"], "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}}, {"name": "Create Android project", "run": "set -e\nP=proj\nmkdir -p $P/app/src/main/java/com/example/zadachnik $P/app/src/main/assets $P/app/src/main/res/values $P/app/src/main/res/drawable $P/app/src/main/res/xml\ncp index.html $P/app/src/main/assets/index.html\ncd $P\ncat > settings.gradle <<'EOF'\npluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = \"Zadachnik\"\ninclude ':app'\nEOF\ncat > build.gradle <<'EOF'\nplugins { id 'com.android.application' version '8.5.2' apply false }\nEOF\ncat > gradle.properties <<'EOF'\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nEOF\ncat > app/build.gradle <<'EOF'\nplugins { id 'com.android.application' }\nandroid {\n    namespace 'com.example.zadachnik'\n    compileSdk 34\n    signingConfigs {\n        fixed {\n            storeFile file('fixed.jks')\n            storePassword 'zadachnik'\n            keyAlias 'zadachnik'\n            keyPassword 'zadachnik'\n        }\n    }\n    buildTypes {\n        debug { signingConfig signingConfigs.fixed }\n    }\n    defaultConfig {\n        applicationId 'com.example.zadachnik'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\ndependencies {\n    implementation 'androidx.webkit:webkit:1.11.0'\n    implementation 'androidx.core:core:1.13.1'\n}\nEOF\necho '' | base64 -d > app/fixed.jks\nsed -i \"s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER:-1}/\" app/build.gradle\ncat > app/src/main/AndroidManifest.xml <<'EOF'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"@drawable/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\">\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\"\n            android:configChanges=\"orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize\"\n            android:windowSoftInputMode=\"adjustResize\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n        <provider\n            android:name=\"androidx.core.content.FileProvider\"\n            android:authorities=\"${applicationId}.fileprovider\"\n            android:exported=\"false\"\n            android:grantUriPermissions=\"true\">\n            <meta-data\n                android:name=\"android.support.FILE_PROVIDER_PATHS\"\n                android:resource=\"@xml/file_paths\" />\n        </provider>\n    </application>\n</manifest>\nEOF\ncat > app/src/main/java/com/example/zadachnik/MainActivity.java <<'EOF'\npackage com.example.zadachnik;\n\nimport android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\nimport android.content.ContentResolver;\nimport android.content.ContentUris;\nimport android.content.ContentValues;\nimport android.database.Cursor;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.provider.MediaStore;\nimport android.util.Base64;\nimport android.view.View;\nimport android.view.WindowInsets;\nimport android.view.WindowInsetsController;\nimport android.view.WindowManager;\nimport android.webkit.JavascriptInterface;\nimport android.webkit.ValueCallback;\nimport android.webkit.WebChromeClient;\nimport android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.widget.Toast;\nimport androidx.core.content.FileProvider;\nimport androidx.webkit.WebViewAssetLoader;\nimport java.io.ByteArrayOutputStream;\nimport java.io.File;\nimport java.io.FileInputStream;\nimport java.io.FileOutputStream;\nimport java.io.OutputStream;\nimport java.text.SimpleDateFormat;\nimport java.util.Arrays;\nimport java.util.Date;\nimport java.util.Locale;\n\npublic class MainActivity extends Activity {\n    private WebView web;\n    private ValueCallback<Uri[]> chooser;\n    private boolean forcePub = false;\n\n    public class Bridge {\n        private long lastPub = 0;\n\n        private String publicWrite(String name, byte[] data) {\n            try {\n                if (Build.VERSION.SDK_INT >= 29) {\n                    ContentResolver cr = getContentResolver();\n                    Uri coll = MediaStore.Files.getContentUri(\"external\");\n                    String sel = MediaStore.MediaColumns.DISPLAY_NAME + \"=? AND \" + MediaStore.MediaColumns.RELATIVE_PATH + \"=?\";\n                    Cursor c = cr.query(coll, new String[]{MediaStore.MediaColumns._ID}, sel, new String[]{name, \"Documents/Zadachnik/\"}, null);\n                    Uri uri = null;\n                    if (c != null) {\n                        if (c.moveToFirst()) { uri = ContentUris.withAppendedId(coll, c.getLong(0)); }\n                        c.close();\n                    }\n                    if (uri == null) {\n                        ContentValues v = new ContentValues();\n                        v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);\n                        v.put(MediaStore.MediaColumns.MIME_TYPE, \"application/json\");\n                        v.put(MediaStore.MediaColumns.RELATIVE_PATH, \"Documents/Zadachnik\");\n                        uri = cr.insert(coll, v);\n                    }\n                    if (uri == null) { return \"\"; }\n                    OutputStream o = cr.openOutputStream(uri, \"wt\");\n                    o.write(data);\n                    o.close();\n                    return \"Documents/Zadachnik/\" + name;\n                } else {\n                    File dir = new File(getExternalFilesDir(null), \"backup\");\n                    dir.mkdirs();\n                    File f = new File(dir, name);\n                    write(f, data);\n                    return f.getAbsolutePath();\n                }\n            } catch (Exception e) {\n                e.printStackTrace();\n                return \"\";\n            }\n        }\n\n        @JavascriptInterface\n        public String saveBackup(String json, String name) {\n            try {\n                final String r = publicWrite(name.replaceAll(\"[^A-Za-z0-9._-]\", \"_\"), json.getBytes(\"UTF-8\"));\n                runOnUiThread(new Runnable() {\n                    @Override\n                    public void run() {\n                        Toast.makeText(MainActivity.this, r.isEmpty() ? \"Backup failed\" : \"Saved: \" + r, Toast.LENGTH_LONG).show();\n                    }\n                });\n                return r;\n            } catch (Exception e) {\n                return \"\";\n            }\n        }\n\n        private void write(File f, byte[] data) throws Exception {\n            FileOutputStream o = new FileOutputStream(f);\n            o.write(data);\n            o.close();\n        }\n\n        private String read(File f) {\n            try {\n                if (!f.exists()) { return \"\"; }\n                FileInputStream in = new FileInputStream(f);\n                ByteArrayOutputStream b = new ByteArrayOutputStream();\n                byte[] buf = new byte[65536];\n                int n;\n                while ((n = in.read(buf)) > 0) { b.write(buf, 0, n); }\n                in.close();\n                return b.toString(\"UTF-8\");\n            } catch (Exception e) {\n                return \"\";\n            }\n        }\n\n        @JavascriptInterface\n        public void saveData(String json) {\n            try {\n                byte[] data = json.getBytes(\"UTF-8\");\n                File dir = getFilesDir();\n                File t = new File(dir, \"data.tmp\");\n                write(t, data);\n                File f = new File(dir, \"data.json\");\n                if (!t.renameTo(f)) { f.delete(); t.renameTo(f); }\n                String day = new SimpleDateFormat(\"yyyyMMdd\", Locale.US).format(new Date());\n                write(new File(dir, \"snap_\" + day + \".json\"), data);\n                long now = System.currentTimeMillis();\n                if (forcePub || now - lastPub > 300000) {\n                    forcePub = false;\n                    lastPub = now;\n                    publicWrite(\"Zadachnik_backup_\" + day + \".json\", data);\n                }\n                String[] names = dir.list();\n                if (names != null) {\n                    Arrays.sort(names);\n                    int snaps = 0;\n                    for (int k = names.length - 1; k >= 0; k--) {\n                        if (names[k].startsWith(\"snap_\")) {\n                            snaps++;\n                            if (snaps > 14) { new File(dir, names[k]).delete(); }\n                        }\n                    }\n                }\n            } catch (Exception e) {\n                e.printStackTrace();\n            }\n        }\n\n        @JavascriptInterface\n        public String loadData() {\n            return read(new File(getFilesDir(), \"data.json\"));\n        }\n\n        @JavascriptInterface\n        public String listSnaps() {\n            String[] names = getFilesDir().list();\n            if (names == null) { return \"\"; }\n            Arrays.sort(names);\n            StringBuilder sb = new StringBuilder();\n            for (int k = names.length - 1; k >= 0; k--) {\n                if (names[k].startsWith(\"snap_\") && names[k].endsWith(\".json\")) {\n                    if (sb.length() > 0) { sb.append(\",\"); }\n                    sb.append(names[k].substring(5, 13));\n                }\n            }\n            return sb.toString();\n        }\n\n        @JavascriptInterface\n        public String loadSnap(String day) {\n            return read(new File(getFilesDir(), \"snap_\" + day.replaceAll(\"[^0-9]\", \"\") + \".json\"));\n        }\n\n        @JavascriptInterface\n        public void setImmersive(final boolean on) {\n            runOnUiThread(new Runnable() {\n                @Override\n                public void run() {\n                    if (Build.VERSION.SDK_INT >= 30) {\n                        WindowInsetsController c = getWindow().getInsetsController();\n                        if (c == null) { return; }\n                        if (on) {\n                            c.hide(WindowInsets.Type.systemBars());\n                            c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\n                        } else {\n                            c.show(WindowInsets.Type.systemBars());\n                        }\n                    } else {\n                        View d = getWindow().getDecorView();\n                        d.setSystemUiVisibility(on ? (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY\n                                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION\n                                | View.SYSTEM_UI_FLAG_FULLSCREEN\n                                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE\n                                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION\n                                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN) : 0);\n                    }\n                }\n            });\n        }\n\n        @JavascriptInterface\n        public void shareFile(String b64, String name, final String mime) {\n            try {\n                File dir = new File(getCacheDir(), \"pdf\");\n                dir.mkdirs();\n                File[] old = dir.listFiles();\n                if (old != null) { for (File x : old) { x.delete(); } }\n                File f = new File(dir, name.replaceAll(\"[\\\\\\\\/:*?\\\"<>|]\", \"_\"));\n                FileOutputStream o = new FileOutputStream(f);\n                o.write(Base64.decode(b64, Base64.DEFAULT));\n                o.close();\n                final Uri uri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + \".fileprovider\", f);\n                runOnUiThread(new Runnable() {\n                    @Override\n                    public void run() {\n                        Intent i = new Intent(Intent.ACTION_SEND);\n                        i.setType(mime);\n                        i.putExtra(Intent.EXTRA_SUBJECT, name);\n                        i.putExtra(Intent.EXTRA_STREAM, uri);\n                        i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);\n                        startActivity(Intent.createChooser(i, \"Send\"));\n                    }\n                });\n            } catch (Exception e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\n    @Override\n    protected void onCreate(Bundle state) {\n        super.onCreate(state);\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n        final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()\n                .addPathHandler(\"/assets/\", new WebViewAssetLoader.AssetsPathHandler(this))\n                .build();\n        web = new WebView(this);\n        setContentView(web);\n        WebSettings s = web.getSettings();\n        s.setJavaScriptEnabled(true);\n        s.setDomStorageEnabled(true);\n        s.setAllowFileAccess(false);\n        web.addJavascriptInterface(new Bridge(), \"Android\");\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override\n            public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {\n                if (chooser != null) { chooser.onReceiveValue(null); }\n                chooser = cb;\n                try {\n                    startActivityForResult(p.createIntent(), 77);\n                } catch (Exception e) {\n                    chooser = null;\n                    return false;\n                }\n                return true;\n            }\n        });\n        web.setWebViewClient(new WebViewClient() {\n            @Override\n            public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {\n                return loader.shouldInterceptRequest(r.getUrl());\n            }\n        });\n        if (state == null) {\n            web.loadUrl(\"https://appassets.androidplatform.net/assets/index.html\");\n        } else {\n            web.restoreState(state);\n        }\n    }\n\n    @Override\n    protected void onActivityResult(int req, int res, Intent data) {\n        if (req == 77 && chooser != null) {\n            chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));\n            chooser = null;\n        } else {\n            super.onActivityResult(req, res, data);\n        }\n    }\n\n    @Override\n    protected void onPause() {\n        super.onPause();\n        forcePub = true;\n        if (web != null) {\n            web.evaluateJavascript(\"if(window.flushSave)flushSave()\", null);\n        }\n    }\n\n    @Override\n    protected void onSaveInstanceState(Bundle out) {\n        super.onSaveInstanceState(out);\n        web.saveState(out);\n    }\n}\nEOF\ncat > app/src/main/res/values/strings.xml <<'EOF'\n<resources><string name=\"app_name\">Задачник</string></resources>\nEOF\ncat > app/src/main/res/values/themes.xml <<'EOF'\n<resources>\n    <style name=\"AppTheme\" parent=\"android:Theme.Material.Light.NoActionBar\">\n        <item name=\"android:statusBarColor\">#3D6B5E</item>\n        <item name=\"android:navigationBarColor\">#3D6B5E</item>\n    </style>\n</resources>\nEOF\ncat > app/src/main/res/xml/file_paths.xml <<'EOF'\n<paths><cache-path name=\"pdf\" path=\"pdf/\" /></paths>\nEOF\ncat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'\n<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:width=\"96dp\" android:height=\"96dp\" android:viewportWidth=\"96\" android:viewportHeight=\"96\">\n    <path android:fillColor=\"#3D6B5E\" android:pathData=\"M0,0h96v96h-96z\"/>\n    <path android:fillColor=\"#FFFEFB\" android:pathData=\"M24,14h48v68h-48z\"/>\n    <path android:fillColor=\"#3D6B5E\" android:pathData=\"M24,14h8v68h-8z\"/>\n    <path android:strokeColor=\"#8A877C\" android:strokeWidth=\"2\" android:pathData=\"M38,30h28M38,42h28M38,54h28M38,66h28\"/>\n    <path android:strokeColor=\"#C0543A\" android:strokeWidth=\"3\" android:strokeLineCap=\"round\" android:pathData=\"M40,30l6,0\"/>\n</vector>\nEOF\n"}, {"name": "Build debug APK", "working-directory": "proj", "run": "gradle assembleDebug --no-daemon"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "Zadachnik-APK", "path": "proj/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
