{"name": "Build APK", "on": ["push", "workflow_dispatch"], "jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}}, {"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.7"}}, {"name": "Create Android project", "run": "set -e\nP=proj\nmkdir -p $P/app/src/main/java/com/example/zadachnik $P/app/src/main/assets $P/app/src/main/res/values $P/app/src/main/res/drawable $P/app/src/main/res/xml\ncp index.html $P/app/src/main/assets/index.html\ncd $P\ncat > settings.gradle <<'EOF'\npluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories { google(); mavenCentral() }\n}\nrootProject.name = \"Zadachnik\"\ninclude ':app'\nEOF\ncat > build.gradle <<'EOF'\nplugins { id 'com.android.application' version '8.5.2' apply false }\nEOF\ncat > gradle.properties <<'EOF'\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nEOF\ncat > app/build.gradle <<'EOF'\nplugins { id 'com.android.application' }\nandroid {\n    namespace 'com.example.zadachnik'\n    compileSdk 34\n    defaultConfig {\n        applicationId 'com.example.zadachnik'\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName '1.0'\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\ndependencies {\n    implementation 'androidx.webkit:webkit:1.11.0'\n    implementation 'androidx.core:core:1.13.1'\n}\nEOF\ncat > app/src/main/AndroidManifest.xml <<'EOF'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"@drawable/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\">\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\"\n            android:configChanges=\"orientation|screenSize|screenLayout|keyboardHidden|smallestScreenSize\"\n            android:windowSoftInputMode=\"adjustResize\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n        <provider\n            android:name=\"androidx.core.content.FileProvider\"\n            android:authorities=\"${applicationId}.fileprovider\"\n            android:exported=\"false\"\n            android:grantUriPermissions=\"true\">\n            <meta-data\n                android:name=\"android.support.FILE_PROVIDER_PATHS\"\n                android:resource=\"@xml/file_paths\" />\n        </provider>\n    </application>\n</manifest>\nEOF\ncat > app/src/main/java/com/example/zadachnik/MainActivity.java <<'EOF'\npackage com.example.zadachnik;\n\nimport android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\nimport android.os.Bundle;\nimport android.util.Base64;\nimport android.view.WindowManager;\nimport android.webkit.JavascriptInterface;\nimport android.webkit.WebResourceRequest;\nimport android.webkit.WebResourceResponse;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport androidx.core.content.FileProvider;\nimport androidx.webkit.WebViewAssetLoader;\nimport java.io.File;\nimport java.io.FileOutputStream;\n\npublic class MainActivity extends Activity {\n    private WebView web;\n\n    public class Bridge {\n        @JavascriptInterface\n        public void sharePdf(String b64, String name) {\n            try {\n                File dir = new File(getCacheDir(), \"pdf\");\n                dir.mkdirs();\n                File[] old = dir.listFiles();\n                if (old != null) { for (File x : old) { x.delete(); } }\n                File f = new File(dir, name.replaceAll(\"[^A-Za-z0-9._-]\", \"_\"));\n                FileOutputStream o = new FileOutputStream(f);\n                o.write(Base64.decode(b64, Base64.DEFAULT));\n                o.close();\n                final Uri uri = FileProvider.getUriForFile(MainActivity.this, getPackageName() + \".fileprovider\", f);\n                runOnUiThread(new Runnable() {\n                    @Override\n                    public void run() {\n                        Intent i = new Intent(Intent.ACTION_SEND);\n                        i.setType(\"application/pdf\");\n                        i.putExtra(Intent.EXTRA_STREAM, uri);\n                        i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);\n                        startActivity(Intent.createChooser(i, \"PDF\"));\n                    }\n                });\n            } catch (Exception e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\n    @Override\n    protected void onCreate(Bundle state) {\n        super.onCreate(state);\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n        final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()\n                .addPathHandler(\"/assets/\", new WebViewAssetLoader.AssetsPathHandler(this))\n                .build();\n        web = new WebView(this);\n        setContentView(web);\n        WebSettings s = web.getSettings();\n        s.setJavaScriptEnabled(true);\n        s.setDomStorageEnabled(true);\n        s.setAllowFileAccess(false);\n        web.addJavascriptInterface(new Bridge(), \"Android\");\n        web.setWebViewClient(new WebViewClient() {\n            @Override\n            public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {\n                return loader.shouldInterceptRequest(r.getUrl());\n            }\n        });\n        if (state == null) {\n            web.loadUrl(\"https://appassets.androidplatform.net/assets/index.html\");\n        } else {\n            web.restoreState(state);\n        }\n    }\n\n    @Override\n    protected void onSaveInstanceState(Bundle out) {\n        super.onSaveInstanceState(out);\n        web.saveState(out);\n    }\n}\nEOF\ncat > app/src/main/res/values/strings.xml <<'EOF'\n<resources><string name=\"app_name\">Задачник</string></resources>\nEOF\ncat > app/src/main/res/values/themes.xml <<'EOF'\n<resources>\n    <style name=\"AppTheme\" parent=\"android:Theme.Material.Light.NoActionBar\">\n        <item name=\"android:statusBarColor\">#3D6B5E</item>\n        <item name=\"android:navigationBarColor\">#3D6B5E</item>\n    </style>\n</resources>\nEOF\ncat > app/src/main/res/xml/file_paths.xml <<'EOF'\n<paths><cache-path name=\"pdf\" path=\"pdf/\" /></paths>\nEOF\ncat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'\n<vector xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:width=\"96dp\" android:height=\"96dp\" android:viewportWidth=\"96\" android:viewportHeight=\"96\">\n    <path android:fillColor=\"#3D6B5E\" android:pathData=\"M0,0h96v96h-96z\"/>\n    <path android:fillColor=\"#FFFEFB\" android:pathData=\"M24,14h48v68h-48z\"/>\n    <path android:fillColor=\"#3D6B5E\" android:pathData=\"M24,14h8v68h-8z\"/>\n    <path android:strokeColor=\"#8A877C\" android:strokeWidth=\"2\" android:pathData=\"M38,30h28M38,42h28M38,54h28M38,66h28\"/>\n    <path android:strokeColor=\"#C0543A\" android:strokeWidth=\"3\" android:strokeLineCap=\"round\" android:pathData=\"M40,30l6,0\"/>\n</vector>\nEOF\n"}, {"name": "Build debug APK", "working-directory": "proj", "run": "gradle assembleDebug --no-daemon"}, {"uses": "actions/upload-artifact@v4", "with": {"name": "Zadachnik-APK", "path": "proj/app/build/outputs/apk/debug/app-debug.apk"}}]}}}
